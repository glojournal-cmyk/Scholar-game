name: Inspect current game code
on:
  push:
    paths:
      - .github/workflows/inspect-scholar-bundle.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current compiled bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('assets/index-Dmik1R0C.js')
          if not p.exists():
              p=next(Path('assets').glob('index-*.js'))
          s=p.read_text(encoding='utf-8', errors='replace')
          out=[f'Source {p} len={len(s)}']
          for kw in ('mastery','wardrobe','outfit','equippedOutfit','localStorage','getItem','setItem'):
              finds=list(re.finditer(re.escape(kw),s,re.I))
              out.append('KEYWORD '+kw+' occurrences '+str(len(finds)))
              for m in finds[:18]:
                  out.append(f'{kw}@{m.start()} '+s[max(0,m.start()-280):m.end()+330].replace(chr(10),' ')[:650])
          Path('art/doll/medical/dev-inspection.txt').write_text(chr(10).join(out)+chr(10),encoding='utf-8')
          PY
      - name: Commit source inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/doll/medical/dev-inspection.txt
          if ! git diff --cached --quiet; then
            git commit -m "Add compiled mastery and wardrobe inspection snippets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
